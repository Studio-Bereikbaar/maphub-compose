version: "3.9"

# Coolify deployment — Traefik removed (Coolify provides its own proxy).
# Set FRONT_URL, API_URL, AUTH_URL as full URLs in Coolify env vars.
# Example: FRONT_URL=https://maphub.studiobereikbaar.nl

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-maphub}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

  minio:
    # Pinned 2026-05-19 (hardening A1) — was the dormant .pre-A1-bak fix.
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      retries: 5
      timeout: 5s

  api:
    # Pinned 2026-05-19 (hardening A1, April-2026-RCE-vector closure).
    image: noxdecima/maphub-api@sha256:4f0c622d3c1df96665ff3be3c9d2d438f54aecae0b95a7e9490dfd000e59019b
    command: [ "sh", "-c", "alembic upgrade head && hypercorn app:app --bind 0.0.0.0:8000 --worker-class asyncio --workers 2" ]
    volumes:
      - /opt/maphub-patches/process_vector.py:/app/tasks/process_vector.py:ro
    environment:
      ALLOWED_ORIGINS: "*"
      API_URL: ${API_URL}
      FRONT_END_URL: ${FRONT_URL}
      STAGE: ${STAGE:-local}

      # Database
      DB_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-maphub}

      # Storage (MinIO)
      STORAGE_TYPE: minio
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      DATA_BUCKET: ${DATA_BUCKET:-maphub-data}

      # Stripe (live|disabled)
      STRIPE_MODE: disabled

      # Keycloak
      AUTH_PROVIDER: keycloak
      AUTH_HOST: ${AUTH_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-maphub}
      KEYCLOAK_ISSUER: ${AUTH_URL}/realms/${KEYCLOAK_REALM:-maphub}

      # SMTP for API (optional)
      MAIL_SERVER: ${MAIL_SERVER}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM:-notifications@maphub.local}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-MapHub Notifications}

    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8000/docs || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 10

    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  front:
    # Pinned 2026-05-19 (hardening A1, April-2026-RCE-vector closure).
    image: noxdecima/maphub-front@sha256:a463623f6a0517dbe84c332554d9ba322cfdb0d7f814af93938dc98205333517
    volumes:
      - /opt/maphub-patches/front-next-build:/app/.next:ro
    environment:
      # GENERAL
      NEXT_PUBLIC_ENV: production
      NEXT_PUBLIC_BASE_URL: ${FRONT_URL}

      # MAPBOX
      NEXT_PUBLIC_MAPBOX_TOKEN: ${MAPBOX_TOKEN}

      # MAPHUB
      NEXT_PUBLIC_MAPHUB_API_URL: ${API_URL}

      # AUTH
      NEXT_PUBLIC_AUTH_PROVIDER: keycloak
      NEXTAUTH_URL: ${FRONT_URL}
      KEYCLOAK_HOST: ${AUTH_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-maphub}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-maphub-frontend}
      NEXTAUTH_SECRET: ${FRONT_AUTH_SECRET}

    depends_on:
      api:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: [ "start", "--import-realm" ]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_PORT: 8080
      KC_HTTP_ENABLED: "true"
      KC_PROXY: edge
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME_URL: ${AUTH_URL}
      KC_HOSTNAME_STRICT: "false"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./keycloak/realm-maphub.generated.json:/opt/keycloak/data/import/import.json:ro
      - /opt/keycloak-themes/maphub-sb:/opt/keycloak/themes/maphub-sb:ro
    healthcheck:
      test: [ "CMD-SHELL", "timeout 2 bash -lc '</dev/tcp/localhost/8080'" ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  db-data:
  minio-data:
  keycloak-data:
